name: Build OpenWrt for Kimax U35WF 16MB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses5-dev libssl-dev gawk git wget bzip2 zstd

    - name: Download and Extract Image Builder
      run: |
        echo "=== СКАЧИВАНИЕ ИМИДЖ БИЛДЕРА ==="
        wget -q "https://downloads.""openwrt.org/releases/25.12.5/targets/ramips/mt7620/openwrt-imagebuilder-25.12.5-ramips-mt7620.Linux-x86_64.tar.zst"
        
        echo "=== РАСПАКОВКА АРХИВА ==="
        tar --zstd -xf openwrt-imagebuilder-25.12.5-ramips-mt7620.Linux-x86_64.tar.zst
        mv openwrt-imagebuilder-25.12.5-ramips-mt7620.Linux-x86_64 openwrt-ib
        echo "IB_ROOT=$GITHUB_WORKSPACE/openwrt-ib" >> $GITHUB_ENV

    - name: Patch Hardware Limits for 16MB Flash
      run: |
        cd $IB_ROOT
        # 1. Разрешаем компилировать образ размером до 16МБ
        sed -i 's/IMAGE_SIZE := 7808k/IMAGE_SIZE := 15872k/g' target/linux/ramips/image/mt7620.mk
        
        # 2. Расширяем раздел прошивки в DTS
        DTS_FILE="target/linux/ramips/dts/mt7620n_kimax_u35wf.dts"
        if [ -f "$DTS_FILE" ]; then
          sed -i 's/reg = <0x50000 0x7b0000>/reg = <0x50000 0xfb0000>/g' $DTS_FILE
          sed -i 's/reg = <0x50000 0x7B0000>/reg = <0x50000 0xFB0000>/g' $DTS_FILE
        fi

    - name: Pre-configure Network and System Settings
      run: |
        cd $IB_ROOT
        mkdir -p files/etc/config
        
        # 1. Задаем имя устройства
        cat << 'EOF' > files/etc/config/system
        config system
            option hostname 'KimaxNAS'
            option timezone 'UTC'
            option ttylogin '0'
        EOF

        # 2. Переводим интерфейс LAN в режим DHCP-клиента
        cat << 'EOF' > files/etc/config/network
        config interface 'loopback'
            option device 'lo'
            option proto 'static'
            option ipaddr '127.0.0.1'
            option netmask '255.0.0.0'

        config globals 'globals'
            option ula_prefix 'fd00::/48'

        config interface 'lan'
            option device 'eth0'
            option proto 'dhcp'
        EOF

        # 3. Полностью отключаем встроенную раздачу DHCP
        cat << 'EOF' > files/etc/config/dhcp
        # DHCP disabled for NAS mode
        EOF

    - name: Compile OpenWrt Firmware
      run: |
        cd $IB_ROOT
        
        # Набор пакетов: Включаем KSMBD, веб-панель управления luci-app-ksmbd, wsdd2 для Windows, 
        # корневые сертификаты ca-bundle для фикса SSL, USB-драйверы и все файловые системы (включая NTFS3)
        PACKAGES="kmod-usb2 kmod-usb-storage kmod-scsi-core kmod-fs-ext4 kmod-fs-vfat kmod-fs-ntfs3 block-mount luci luci-app-ksmbd ksmbd-utils wsdd2 ca-bundle -luci-app-attendedsysupgrade -ppp -ppp-mod-pppoe -odhcp6c -odhcpd-ipv6only"
        
        # Сборка прошивки
        make image PROFILE="kimax_u35wf" PACKAGES="$PACKAGES" FILES="files"

    - name: Upload Firmware to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Kimax_U35WF_16MB_Firmware
        path: openwrt-ib/bin/targets/ramips/mt7620/*sysupgrade.bin
