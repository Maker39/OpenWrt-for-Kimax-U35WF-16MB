name: Build OpenWrt for Kimax U35WF 16MB

on:
  workflow_dispatch: # Позволяет запускать сборку вручную кнопкой на GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses5-dev libssl-dev gawk git wget bzip2 zstd

    - name: Download and Extract Image Builder
      run: |
        # Делаем скрипт исполняемым и запускаем его напрямую в обход парсера GitHub
        chmod +x download.sh
        ./download.sh
        
        # Передаем путь к сборщику в глобальный контекст шагов
        echo "IB_ROOT=$GITHUB_WORKSPACE/openwrt-ib" >> $GITHUB_ENV

    - name: Patch Hardware Limits for 16MB Flash
      run: |
        cd $IB_ROOT
        # 1. Разрешаем сборщику компилировать образ размером до 16МБ (15872k)
        sed -i 's/IMAGE_SIZE := 7808k/IMAGE_SIZE := 15872k/g' target/linux/ramips/image/mt7620.mk
        
        # 2. Патч DTS для расширения раздела firmware до 16МБ
        DTS_FILE="target/linux/ramips/dts/mt7620n_kimax_u35wf.dts"
        if [ -f "$DTS_FILE" ]; then
          sed -i 's/reg = <0x50000 0x7b0000>/reg = <0x50000 0xfb0000>/g' $DTS_FILE
          sed -i 's/reg = <0x50000 0x7B0000>/reg = <0x50000 0xFB0000>/g' $DTS_FILE
        fi

    - name: Create Custom Configuration Files (First-boot Script)
      run: |
        cd $IB_ROOT
        mkdir -p files/etc/uci-defaults
        
        cat << 'EOF' > files/etc/uci-defaults/99-custom-nas-settings
        #!/bin/sh
        uci set system.@system.hostname='KimaxNAS'
        uci commit system
        uci set network.lan.proto='dhcp'
        uci delete dhcp.lan
        uci commit network
        uci commit dhcp
        /etc/init.d/fstab enable
        exit 0
        EOF
        
        chmod +x files/etc/uci-defaults/99-custom-nas-settings

    - name: Compile OpenWrt Firmware
      run: |
        cd $IB_ROOT
        PACKAGES="kmod-usb2 kmod-usb-storage kmod-scsi-core kmod-fs-ext4 kmod-fs-vfat kmod-fs-ntfs3 block-mount luci samba4-server samba4-utils luci-app-samba4 wsdd2 -luci-app-attendedsysupgrade -ppp -ppp-mod-pppoe -odhcp6c -odhcpd-ipv6only"
        make image PROFILE="kimax_u35wf" PACKAGES="$PACKAGES" FILES="files/"

    - name: Upload Firmware to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Kimax_U35WF_16MB_Firmware
        path: openwrt-ib/bin/targets/ramips/mt7620/*sysupgrade.bin
